# Runs the tests on every push. The dataset isn't available here, so tests that need it skip.
name: tests
on: [push, pull_request]
# The tests only need to read the code; keep the automatic GitHub token read-only.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -rs
